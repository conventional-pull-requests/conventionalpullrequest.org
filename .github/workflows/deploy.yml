name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.139.0
  FIREBASE_PROJECT_ID: conventional-pull-request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}

      # Uses baseURL "/" from config.yaml, so links are root-relative and work on
      # the live site, *.web.app, and preview channels alike.
      - name: Build
        run: hugo --minify --gc

      - name: Check generated pages
        run: |
          test -f public/en/v1.0.0-beta.1/index.html
          test -f public/en/about/index.html
          test -f public/en/index.html
          test -f public/index.html
          if grep -rl 'localhost' public; then
            echo "::error::Build output references localhost"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: public
          path: public
          retention-days: 1

  deploy-preview:
    # Fork PRs don't get repository secrets, so skip them.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: public
          path: public

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          expires: 7d

  deploy-live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: firebase-production
      url: https://${{ env.FIREBASE_PROJECT_ID }}.web.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: public
          path: public

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live
