# Builds main and deploys it to the Firebase Hosting live channel.
# Pull request builds and preview channels are handled by preview.yml.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-live
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.139.0
  FIREBASE_PROJECT_ID: conventional-pull-request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: ${{ env.HUGO_VERSION }}

      # Uses baseURL "/" from config.yaml, so links are root-relative and work on
      # the live site and *.web.app alike.
      - name: Build
        run: |
          hugo --minify --gc
          # Firebase Hosting serves /404.html for unknown paths; Hugo writes it per language.
          cp public/en/404.html public/404.html

      - name: Check generated pages
        run: |
          test -f public/en/v1.0.0-beta.1/index.html
          test -f public/en/about/index.html
          test -f public/en/index.html
          test -f public/index.html
          test -f public/404.html
          if grep -rl 'localhost' public; then
            echo "::error::Build output references localhost"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public
          path: public
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: firebase-production
      url: https://conventionalpullrequest.org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public
          path: public

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # Store this as a secret of the firebase-production environment, not the repository,
          # so only main-branch deploys can read it. Previews use FIREBASE_SERVICE_ACCOUNT_PREVIEW.
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONVENTIONAL_PULL_REQUEST }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live
