# Originally generated by the Firebase CLI (https://github.com/firebase/firebase-tools).
# Builds every pull request and deploys same-repo ones to a Firebase Hosting preview channel.
name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  contents: read

concurrency:
  group: firebase-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.139.0
  FIREBASE_PROJECT_ID: conventional-pull-request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: ${{ env.HUGO_VERSION }}

      # Uses baseURL "/" from config.yaml, so links are root-relative and work on
      # preview channels as well as the live site.
      - name: Build
        run: |
          hugo --minify --gc
          # Firebase Hosting serves /404.html for unknown paths; Hugo writes it per language.
          cp public/en/404.html public/404.html

      - name: Check generated pages
        run: |
          test -f public/en/v1.0.0-beta.1/index.html
          test -f public/en/about/index.html
          test -f public/en/index.html
          test -f public/index.html
          test -f public/404.html
          if grep -rl 'localhost' public; then
            echo "::error::Build output references localhost"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public
          path: public
          retention-days: 1

  preview:
    # Fork PRs don't get repository secrets, so they are built but not deployed.
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public
          path: public

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # Shares the production service account until a separate preview account exists, so this
          # secret must stay a repository secret (environment secrets aren't visible to this job).
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONVENTIONAL_PULL_REQUEST }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          expires: 7d
