# Checks that pull requests to this repository follow Conventional Pull Requests.
# Uses pull_request_target so titles can be checked on forks; it never checks out PR code.
name: Conventional pull request

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read

jobs:
  title:
    name: Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            i18n
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The description "{subject}" in the title "{title}" must start with a
            lowercase letter and must not end with a period.

  description:
    name: Description
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { title, body } = context.payload.pull_request;
            const text = body || '';
            const hasSection = (name) =>
              new RegExp(`^##\\s+${name}\\s*$`, 'im').test(text);
            const errors = [];
            if (!hasSection('summary')) {
              errors.push('The description must contain a "## Summary" section.');
            }
            if (/^[a-z]+(\([^)]*\))?!:/i.test(title) && !hasSection('breaking changes')) {
              errors.push('The title marks a breaking change ("!"), so the description must contain a "## Breaking Changes" section.');
            }
            if (errors.length) {
              core.setFailed(errors.join('\n'));
            }
