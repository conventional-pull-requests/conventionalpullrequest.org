{{- $target := printf "%s/" site.Params.versions.current | absLangURL -}}
<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
  <head>
    <meta charset="utf-8">
    <title>{{ site.Title }}</title>
    <link rel="canonical" href="{{ $target }}">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url={{ $target }}">
  </head>
  <body>
    <p>Redirecting to <a href="{{ $target }}">{{ site.Title }} {{ site.Params.versions.current }}</a>.</p>
  </body>
</html>
